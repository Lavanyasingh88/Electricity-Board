<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#1e66d0">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="default">

<link rel="manifest" href="./manifest.webmanifest">

<title>Lavanya Singh Electricity Board</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#eef4ff;
  color:#172033;
}

header{
  background:linear-gradient(135deg,#132b4f,#2667d7);
  color:white;
  padding:25px 18px;
}

.header{
  max-width:1100px;
  margin:auto;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo-icon{
  background:white;
  color:#f5a000;
  width:48px;
  height:48px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
}

h1{
  margin:0;
  font-size:25px;
}

.subtitle{
  margin-top:5px;
  opacity:.85;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:18px;
}

.card{
  background:white;
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

h2{
  margin-top:0;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
}

label{
  font-weight:bold;
  font-size:14px;
}

input,
select,
textarea{
  width:100%;
  padding:13px;
  border:1px solid #d5dbea;
  border-radius:10px;
  font-size:15px;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#2667d7;
}

textarea{
  min-height:80px;
  resize:vertical;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 17px;
  cursor:pointer;
  font-size:15px;
  font-weight:bold;
  background:#2667d7;
  color:white;
}

button:hover{
  opacity:.9;
}

.btn-row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:18px;
}

.secondary{
  background:#e9effc;
  color:#17305c;
}

.danger{
  background:#d9363e;
}

.green{
  background:#198754;
}

/* PHOTO */

.photo-box{
  border:2px dashed #b9c9e8;
  border-radius:15px;
  padding:15px;
  text-align:center;
  background:#f8fbff;
}

.photo-preview{
  width:100%;
  max-width:280px;
  max-height:280px;
  object-fit:cover;
  border-radius:12px;
  margin:10px auto;
  display:block;
  border:1px solid #dce3f1;
}

.photo-placeholder{
  color:#777;
  padding:20px;
}

.saved-photo{
  width:75px;
  height:75px;
  object-fit:cover;
  border-radius:10px;
  border:1px solid #ccd6e8;
}

/* CONSUMERS */

.consumer-list{
  display:grid;
  gap:10px;
}

.consumer{
  border:1px solid #dce3f1;
  padding:14px;
  border-radius:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.consumer-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.consumer-info strong{
  display:block;
  font-size:17px;
}

.consumer-info small{
  color:#687085;
}

/* TABLE */

.reading-table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

.reading-table th,
.reading-table td{
  border:1px solid #dfe4ee;
  padding:10px;
  text-align:left;
}

.reading-table th{
  background:#f1f5fb;
}

/* BILL */

.bill{
  background:#f8fbff;
  border:2px solid #2667d7;
  border-radius:16px;
  padding:20px;
}

.bill-head{
  display:flex;
  justify-content:space-between;
  gap:15px;
  border-bottom:1px solid #ccd6e8;
  padding-bottom:15px;
  margin-bottom:15px;
}

.amount{
  font-size:30px;
  font-weight:bold;
  color:#2667d7;
}

.bill-photo{
  width:180px;
  max-height:180px;
  object-fit:cover;
  border-radius:12px;
  border:1px solid #ccd6e8;
}

.empty{
  text-align:center;
  color:#777;
  padding:20px;
}

.badge{
  display:inline-block;
  background:#e8f0ff;
  color:#2259b5;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

footer{
  text-align:center;
  padding:25px;
  color:#687085;
  font-size:14px;
}

@media(max-width:700px){

  .grid{
    grid-template-columns:1fr;
  }

  .consumer{
    flex-direction:column;
    align-items:flex-start;
  }

  .consumer-left{
    width:100%;
  }

  .consumer button{
    width:100%;
  }

  .reading-table{
    font-size:13px;
  }

  .reading-table th,
  .reading-table td{
    padding:7px;
  }

  h1{
    font-size:21px;
  }

  .card{
    padding:15px;
  }

  .btn-row button{
    width:100%;
  }

  .bill-photo{
    width:100%;
    max-width:250px;
  }

}

@media print{

  body{
    background:white;
  }

  header,
  footer,
  .card:not(:has(#bill)),
  .btn-row{
    display:none !important;
  }

  .container{
    padding:0;
  }

  .card{
    box-shadow:none;
    margin:0;
  }

}

</style>

</head>

<body>

<header>

  <div class="header">

    <div class="logo">

      <div class="logo-icon">
        ⚡
      </div>

      <div>

        <h1>
          LAVANYA SINGH
        </h1>

        <div class="subtitle">
          Electricity Board
        </div>

      </div>

    </div>

  </div>

</header>


<div class="container">


<!-- CONSUMER PROFILE -->

<div class="card">

  <h2>
    👤 Consumer Profile
  </h2>

  <p>
    Create or select a meter holder.
  </p>


  <div class="grid">

    <div class="field">

      <label>
        Consumer Name
      </label>

      <input
        id="name"
        placeholder="Enter full name">

    </div>


    <div class="field">

      <label>
        Consumer Number
      </label>

      <input
        id="consumerNo"
        placeholder="Enter consumer number">

    </div>


    <div class="field">

      <label>
        Meter Number
      </label>

      <input
        id="meterNo"
        placeholder="Enter meter number">

    </div>


    <div class="field">

      <label>
        Mobile Number
      </label>

      <input
        id="mobile"
        type="tel"
        placeholder="Enter mobile number">

    </div>

  </div>


  <div
    class="field"
    style="margin-top:15px">

    <label>
      Address
    </label>

    <textarea
      id="address"
      placeholder="Enter complete address"></textarea>

  </div>


  <!-- METER PHOTO -->

  <div
    class="field"
    style="margin-top:18px">

    <label>
      📷 Meter Photo
    </label>


    <div class="photo-box">

      <div
        id="photoPlaceholder"
        class="photo-placeholder">

        📸 Upload or take a photo of the meter

      </div>


      <img
        id="photoPreview"
        class="photo-preview"
        style="display:none"
        alt="Meter Photo">


      <input
        id="meterPhoto"
        type="file"
        accept="image/*"
        capture="environment">


      <div class="btn-row">

        <button
          type="button"
          class="secondary"
          onclick="removePhoto()">

          🗑️ Remove Photo

        </button>

      </div>

    </div>

  </div>


  <div class="btn-row">

    <button onclick="saveConsumer()">
      💾 Save Consumer
    </button>

    <button
      class="secondary"
      onclick="clearForm()">

      Clear

    </button>

  </div>

</div>


<!-- SAVED CONSUMERS -->

<div class="card">

  <h2>
    📋 Saved Consumers
  </h2>

  <div
    id="consumerList"
    class="consumer-list">

  </div>

</div>


<!-- MONTHLY READING -->

<div class="card">

  <h2>
    ⚡ Monthly Meter Reading
  </h2>


  <div class="grid">

    <div class="field">

      <label>
        Month
      </label>

      <input
        type="month"
        id="month">

    </div>


    <div class="field">

      <label>
        Previous Reading
      </label>

      <input
        type="number"
        id="previous"
        min="0"
        placeholder="Previous meter reading">

    </div>


    <div class="field">

      <label>
        Current Reading
      </label>

      <input
        type="number"
        id="current"
        min="0"
        placeholder="Current meter reading">

    </div>


    <div class="field">

      <label>
        Rate per Unit
      </label>

      <input
        type="number"
        id="rate"
        value="5"
        min="0">

    </div>

  </div>


  <div class="btn-row">

    <button onclick="saveReading()">
      ➕ Save Monthly Reading
    </button>

    <button
      class="secondary"
      onclick="calculateBill()">

      🧮 Calculate

    </button>

  </div>

</div>


<!-- HISTORY -->

<div class="card">

  <h2>
    📊 Monthly History
  </h2>

  <div id="history">

  </div>

</div>


<!-- BILL -->

<div class="card">

  <h2>
    🧾 Bill Preview
  </h2>


  <div
    id="bill"
    class="bill">

    <div class="empty">
      Select a consumer and calculate a bill.
    </div>

  </div>


  <div class="btn-row">

    <button
      class="green"
      onclick="shareBill()">

      📤 Share Bill

    </button>


    <button
      class="secondary"
      onclick="window.print()">

      🖨️ Print Bill

    </button>

  </div>

</div>


</div>


<footer>

  © 2026 Lavanya Singh Electricity Board

</footer>


<script>

/* =========================
   STORAGE
========================= */

const STORAGE_KEY =
  "lavanya_electricity_board_data";


let data =
  JSON.parse(
    localStorage.getItem(STORAGE_KEY)
  ) || {

    consumers: [],

    selected: null

  };


let currentPhoto = "";


/* =========================
   SAVE DATA
========================= */

function saveData(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );

}


/* =========================
   SELECTED CONSUMER
========================= */

function getSelectedConsumer(){

  return data.consumers.find(
    c => c.id === data.selected
  );

}


/* =========================
   PHOTO UPLOAD
========================= */

document
  .getElementById("meterPhoto")
  .addEventListener(
    "change",
    function(event){

      const file =
        event.target.files[0];

      if(!file){
        return;
      }


      if(!file.type.startsWith("image/")){

        alert(
          "Please select an image."
        );

        return;

      }


      const reader =
        new FileReader();


      reader.onload =
        function(e){

          compressImage(
            e.target.result,
            function(compressed){

              currentPhoto =
                compressed;

              showPhoto(
                compressed
              );

            }
          );

        };


      reader.readAsDataURL(file);

    }
  );


/* =========================
   COMPRESS PHOTO
========================= */

function compressImage(
  source,
  callback
){

  const img =
    new Image();


  img.onload =
    function(){

      const maxSize =
        1000;


      let width =
        img.width;


      let height =
        img.height;


      if(width > maxSize){

        height =
          height *
          maxSize /
          width;

        width =
          maxSize;

      }


      if(height > maxSize){

        width =
          width *
          maxSize /
          height;

        height =
          maxSize;

      }


      const canvas =
        document.createElement(
          "canvas"
        );


      canvas.width =
        width;

      canvas.height =
        height;


      const ctx =
        canvas.getContext(
          "2d"
        );


      ctx.drawImage(
        img,
        0,
        0,
        width,
        height
      );


      callback(
        canvas.toDataURL(
          "image/jpeg",
          0.75
        )
      );

    };


  img.src =
    source;

}


/* =========================
   SHOW PHOTO
========================= */

function showPhoto(photo){

  const preview =
    document.getElementById(
      "photoPreview"
    );


  const placeholder =
    document.getElementById(
      "photoPlaceholder"
    );


  if(photo){

    preview.src =
      photo;

    preview.style.display =
      "block";

    placeholder.style.display =
      "none";

  }

  else{

    preview.src =
      "";

    preview.style.display =
      "none";

    placeholder.style.display =
      "block";

  }

}


/* =========================
   REMOVE PHOTO
========================= */

function removePhoto(){

  currentPhoto =
    "";

  document
    .getElementById(
      "meterPhoto"
    )
    .value =
    "";

  showPhoto("");

}


/* =========================
   SAVE CONSUMER
========================= */

function saveConsumer(){

  const name =
    document
      .getElementById("name")
      .value
      .trim();


  const consumerNo =
    document
      .getElementById("consumerNo")
      .value
      .trim();


  const meterNo =
    document
      .getElementById("meterNo")
      .value
      .trim();


  const mobile =
    document
      .getElementById("mobile")
      .value
      .trim();


  const address =
    document
      .getElementById("address")
      .value
      .trim();


  if(!name){

    alert(
      "Please enter consumer name."
    );

    return;

  }


  if(!meterNo){

    alert(
      "Please enter meter number."
    );

    return;

  }


  const existing =
    data.consumers.find(
      c => c.meterNo === meterNo
    );


  if(existing){

    existing.name =
      name;

    existing.consumerNo =
      consumerNo;

    existing.mobile =
      mobile;

    existing.address =
      address;

    if(currentPhoto){

      existing.photo =
        currentPhoto;

    }


    data.selected =
      existing.id;

  }

  else{

    const consumer = {

      id:
        Date.now().toString(),

      name:
        name,

      consumerNo:
        consumerNo,

      meterNo:
        meterNo,

      mobile:
        mobile,

      address:
        address,

      photo:
        currentPhoto || "",

      readings:
        []

    };


    data.consumers.push(
      consumer
    );


    data.selected =
      consumer.id;

  }


  saveData();

  renderConsumers();

  renderHistory();


  alert(
    "Consumer saved successfully. ✅"
  );

}


/* =========================
   SELECT CONSUMER
========================= */

function selectConsumer(id){

  data.selected =
    id;


  const c =
    getSelectedConsumer();


  if(!c){
    return;
  }


  document.getElementById("name").value =
    c.name || "";


  document.getElementById("consumerNo").value =
    c.consumerNo || "";


  document.getElementById("meterNo").value =
    c.meterNo || "";


  document.getElementById("mobile").value =
    c.mobile || "";


  document.getElementById("address").value =
    c.address || "";


  currentPhoto =
    c.photo || "";


  showPhoto(
    currentPhoto
  );


  document
    .getElementById(
      "meterPhoto"
    )
    .value =
    "";


  saveData();

  renderConsumers();

  renderHistory();

}


/* =========================
   DELETE CONSUMER
========================= */

function deleteConsumer(id){

  if(
    !confirm(
      "Delete this consumer and all monthly records?"
    )
  ){

    return;

  }


  data.consumers =
    data.consumers.filter(
      c => c.id !== id
    );


  if(data.selected === id){

    data.selected =
      null;

    clearForm();

  }


  saveData();

  renderConsumers();

  renderHistory();


  document.getElementById("bill").innerHTML =
    '<div class="empty">Select a consumer and calculate a bill.</div>';

}


/* =========================
   CLEAR FORM
========================= */

function clearForm(){

  document.getElementById("name").value =
    "";

  document.getElementById("consumerNo").value =
    "";

  document.getElementById("meterNo").value =
    "";

  document.getElementById("mobile").value =
    "";

  document.getElementById("address").value =
    "";

  removePhoto();

}


/* =========================
   SAVE READING
========================= */

function saveReading(){

  const consumer =
    getSelectedConsumer();


  if(!consumer){

    alert(
      "First select or save a consumer."
    );

    return;

  }


  const month =
    document
      .getElementById("month")
      .value;


  const previous =
    Number(
      document
        .getElementById("previous")
        .value
    );


  const current =
    Number(
      document
        .getElementById("current")
        .value
    );


  const rate =
    Number(
      document
        .getElementById("rate")
        .value
    );


  if(!month){

    alert(
      "Please select month."
    );

    return;

  }


  if(current < previous){

    alert(
      "Current reading cannot be less than previous reading."
    );

    return;

  }


  const units =
    current - previous;


  const amount =
    units * rate;


  const existing =
    consumer.readings.find(
      r => r.month === month
    );


  if(existing){

    existing.previous =
      previous;

    existing.current =
      current;

    existing.units =
      units;

    existing.rate =
      rate;

    existing.amount =
      amount;

    existing.photo =
      consumer.photo || "";

  }

  else{

    consumer.readings.push({

      month:
        month,

      previous:
        previous,

      current:
        current,

      units:
        units,

      rate:
        rate,

      amount:
        amount,

      photo:
        consumer.photo || ""

    });

  }


  consumer.readings.sort(
    (a,b) =>
      a.month.localeCompare(
        b.month
      )
  );


  saveData();

  renderHistory();

  createBill(month);


  alert(
    "Monthly reading saved. ✅"
  );

}


/* =========================
   CALCULATE BILL
========================= */

function calculateBill(){

  const consumer =
    getSelectedConsumer();


  if(!consumer){

    alert(
      "First select a consumer."
    );

    return;

  }


  const month =
    document
      .getElementById("month")
      .value;


  if(!month){

    alert(
      "Select a month."
    );

    return;

  }


  const previous =
    Number(
      document
        .getElementById("previous")
        .value
    );


  const current =
    Number(
      document
        .getElementById("current")
        .value
    );


  const rate =
    Number(
      document
        .getElementById("rate")
        .value
    );


  if(current < previous){

    alert(
      "Current reading cannot be less than previous reading."
    );

    return;

  }


  const units =
    current - previous;


  const amount =
    units * rate;


  showBill(
    consumer,
    month,
    previous,
    current,
    units,
    rate,
    amount
  );

}


/* =========================
   CREATE BILL
========================= */

function createBill(month){

  const consumer =
    getSelectedConsumer();


  if(!consumer){
    return;
  }


  const r =
    consumer.readings.find(
      x => x.month === month
    );


  if(!r){
    return;
  }


  showBill(

    consumer,

    r.month,

    r.previous,

    r.current,

    r.units,

    r.rate,

    r.amount

  );

}


/* =========================
   SHOW BILL
========================= */

function showBill(
  consumer,
  month,
  previous,
  current,
  units,
  rate,
  amount
){

  const formattedMonth =
    new Date(
      month + "-01"
    ).toLocaleDateString(
      "en-IN",
      {
        month:"long",
        year:"numeric"
      }
    );


  const photoHTML =
    consumer.photo
    ?
    `
      <div style="margin-top:15px">

        <strong>
          Meter Photo
        </strong>

        <br><br>

        <img
          class="bill-photo"
          src="${consumer.photo}"
          alt="Meter Photo">

      </div>
    `
    :
    "";


  document.getElementById("bill").innerHTML = `

    <div class="bill-head">

      <div>

        <h2>
          ⚡ Electricity Bill
        </h2>

        <strong>
          Lavanya Singh Electricity Board
        </strong>

      </div>


      <div>

        <span class="badge">
          ${formattedMonth}
        </span>

      </div>

    </div>


    <p>
      <strong>Consumer:</strong>
      ${escapeHTML(consumer.name)}
    </p>


    <p>
      <strong>Consumer No:</strong>
      ${escapeHTML(
        consumer
