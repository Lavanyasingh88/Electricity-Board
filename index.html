<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#1e66d0">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="default">

<link rel="manifest" href="./manifest.webmanifest">

<title>Lavanya Singh Electricity Board</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#eef4ff;
  color:#172033;
}

/* HEADER */

header{
  background:linear-gradient(135deg,#132b4f,#2667d7);
  color:white;
  padding:25px 18px;
}

.header{
  max-width:1100px;
  margin:auto;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo-icon{
  background:white;
  color:#f5a000;
  width:48px;
  height:48px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
}

h1{
  margin:0;
  font-size:25px;
}

.subtitle{
  margin-top:5px;
  opacity:.85;
}

/* MAIN */

.container{
  max-width:1100px;
  margin:auto;
  padding:18px;
}

.card{
  background:white;
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

h2{
  margin-top:0;
}

/* FORM */

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
}

label{
  font-weight:bold;
  font-size:14px;
}

input,
select,
textarea{
  width:100%;
  padding:13px;
  border:1px solid #d5dbea;
  border-radius:10px;
  font-size:15px;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#2667d7;
}

textarea{
  min-height:80px;
  resize:vertical;
}

/* BUTTONS */

button{
  border:0;
  border-radius:10px;
  padding:12px 17px;
  cursor:pointer;
  font-size:15px;
  font-weight:bold;
  background:#2667d7;
  color:white;
}

button:hover{
  opacity:.9;
}

.btn-row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:18px;
}

.secondary{
  background:#e9effc;
  color:#17305c;
}

.danger{
  background:#d9363e;
}

.green{
  background:#198754;
}

/* CONSUMERS */

.consumer-list{
  display:grid;
  gap:10px;
}

.consumer{
  border:1px solid #dce3f1;
  padding:14px;
  border-radius:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.consumer-info strong{
  display:block;
  font-size:17px;
}

.consumer-info small{
  color:#687085;
}

/* TABLE */

.reading-table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

.reading-table th,
.reading-table td{
  border:1px solid #dfe4ee;
  padding:10px;
  text-align:left;
}

.reading-table th{
  background:#f1f5fb;
}

/* BILL */

.bill{
  background:#f8fbff;
  border:2px solid #2667d7;
  border-radius:16px;
  padding:20px;
}

.bill-head{
  display:flex;
  justify-content:space-between;
  gap:15px;
  border-bottom:1px solid #ccd6e8;
  padding-bottom:15px;
  margin-bottom:15px;
}

.amount{
  font-size:30px;
  font-weight:bold;
  color:#2667d7;
}

.empty{
  text-align:center;
  color:#777;
  padding:20px;
}

.badge{
  display:inline-block;
  background:#e8f0ff;
  color:#2259b5;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

/* FOOTER */

footer{
  text-align:center;
  padding:25px;
  color:#687085;
  font-size:14px;
}

/* MOBILE */

@media(max-width:700px){

  .grid{
    grid-template-columns:1fr;
  }

  .consumer{
    flex-direction:column;
    align-items:flex-start;
  }

  .consumer button{
    width:100%;
  }

  .reading-table{
    font-size:13px;
  }

  .reading-table th,
  .reading-table td{
    padding:7px;
  }

  h1{
    font-size:21px;
  }

  .card{
    padding:15px;
  }

  .btn-row button{
    width:100%;
  }

}

</style>

</head>

<body>

<!-- HEADER -->

<header>

  <div class="header">

    <div class="logo">

      <div class="logo-icon">
        ⚡
      </div>

      <div>

        <h1>
          LAVANYA SINGH
        </h1>

        <div class="subtitle">
          Electricity Board
        </div>

      </div>

    </div>

  </div>

</header>


<div class="container">


<!-- ========================= -->
<!-- CONSUMER PROFILE -->
<!-- ========================= -->

<div class="card">

  <h2>
    👤 Consumer Profile
  </h2>

  <p>
    Create or select a meter holder.
  </p>


  <div class="grid">

    <div class="field">

      <label>
        Consumer Name
      </label>

      <input
        id="name"
        placeholder="Enter full name">

    </div>


    <div class="field">

      <label>
        Consumer Number
      </label>

      <input
        id="consumerNo"
        placeholder="Enter consumer number">

    </div>


    <div class="field">

      <label>
        Meter Number
      </label>

      <input
        id="meterNo"
        placeholder="Enter meter number">

    </div>


    <div class="field">

      <label>
        Mobile Number
      </label>

      <input
        id="mobile"
        type="tel"
        placeholder="Enter mobile number">

    </div>

  </div>


  <div
    class="field"
    style="margin-top:15px">

    <label>
      Address
    </label>

    <textarea
      id="address"
      placeholder="Enter complete address"></textarea>

  </div>


  <div class="btn-row">

    <button onclick="saveConsumer()">
      💾 Save Consumer
    </button>

    <button
      class="secondary"
      onclick="clearForm()">

      Clear

    </button>

  </div>

</div>


<!-- ========================= -->
<!-- SAVED CONSUMERS -->
<!-- ========================= -->

<div class="card">

  <h2>
    📋 Saved Consumers
  </h2>

  <div
    id="consumerList"
    class="consumer-list">

  </div>

</div>


<!-- ========================= -->
<!-- MONTHLY READING -->
<!-- ========================= -->

<div class="card">

  <h2>
    ⚡ Monthly Meter Reading
  </h2>


  <div class="grid">


    <div class="field">

      <label>
        Month
      </label>

      <input
        type="month"
        id="month">

    </div>


    <div class="field">

      <label>
        Previous Reading
      </label>

      <input
        type="number"
        id="previous"
        min="0"
        placeholder="Previous meter reading">

    </div>


    <div class="field">

      <label>
        Current Reading
      </label>

      <input
        type="number"
        id="current"
        min="0"
        placeholder="Current meter reading">

    </div>


    <div class="field">

      <label>
        Rate per Unit
      </label>

      <input
        type="number"
        id="rate"
        value="5"
        min="0">

    </div>

  </div>


  <div class="btn-row">

    <button onclick="saveReading()">
      ➕ Save Monthly Reading
    </button>

    <button
      class="secondary"
      onclick="calculateBill()">

      🧮 Calculate

    </button>

  </div>

</div>


<!-- ========================= -->
<!-- MONTHLY HISTORY -->
<!-- ========================= -->

<div class="card">

  <h2>
    📊 Monthly History
  </h2>

  <div id="history">

  </div>

</div>


<!-- ========================= -->
<!-- BILL -->
<!-- ========================= -->

<div class="card">

  <h2>
    🧾 Bill Preview
  </h2>


  <div
    id="bill"
    class="bill">

    <div class="empty">
      Select a consumer and calculate a bill.
    </div>

  </div>


  <div class="btn-row">

    <button
      class="green"
      onclick="shareBill()">

      📤 Share Bill

    </button>


    <button
      class="secondary"
      onclick="window.print()">

      🖨️ Print Bill

    </button>

  </div>

</div>


</div>


<footer>

  © 2026 Lavanya Singh Electricity Board

</footer>



<!-- ========================= -->
<!-- JAVASCRIPT -->
<!-- ========================= -->

<script>


/* STORAGE */

const STORAGE_KEY =
  "lavanya_electricity_board_data";


let data =
  JSON.parse(
    localStorage.getItem(STORAGE_KEY)
  ) || {

    consumers: [],

    selected: null

  };


/* SAVE DATA */

function saveData(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );

}


/* SELECTED CONSUMER */

function getSelectedConsumer(){

  return data.consumers.find(
    c => c.id === data.selected
  );

}


/* ========================= */
/* SAVE CONSUMER */
/* ========================= */

function saveConsumer(){

  const name =
    document
      .getElementById("name")
      .value
      .trim();


  const consumerNo =
    document
      .getElementById("consumerNo")
      .value
      .trim();


  const meterNo =
    document
      .getElementById("meterNo")
      .value
      .trim();


  const mobile =
    document
      .getElementById("mobile")
      .value
      .trim();


  const address =
    document
      .getElementById("address")
      .value
      .trim();


  if(!name){

    alert(
      "Please enter consumer name."
    );

    return;

  }


  if(!meterNo){

    alert(
      "Please enter meter number."
    );

    return;

  }


  const existing =
    data.consumers.find(
      c => c.meterNo === meterNo
    );


  /* UPDATE EXISTING */

  if(existing){

    existing.name =
      name;

    existing.consumerNo =
      consumerNo;

    existing.mobile =
      mobile;

    existing.address =
      address;

    data.selected =
      existing.id;

  }


  /* CREATE NEW */

  else{

    const consumer = {

      id:
        Date.now().toString(),

      name:
        name,

      consumerNo:
        consumerNo,

      meterNo:
        meterNo,

      mobile:
        mobile,

      address:
        address,

      readings:
        []

    };


    data.consumers.push(
      consumer
    );


    data.selected =
      consumer.id;

  }


  saveData();

  renderConsumers();

  renderHistory();

  alert(
    "Consumer saved successfully. ✅"
  );

}


/* ========================= */
/* SELECT CONSUMER */
/* ========================= */

function selectConsumer(id){

  data.selected =
    id;


  const c =
    getSelectedConsumer();


  if(!c){
    return;
  }


  document.getElementById("name").value =
    c.name || "";


  document.getElementById("consumerNo").value =
    c.consumerNo || "";


  document.getElementById("meterNo").value =
    c.meterNo || "";


  document.getElementById("mobile").value =
    c.mobile || "";


  document.getElementById("address").value =
    c.address || "";


  saveData();

  renderConsumers();

  renderHistory();

}


/* ========================= */
/* DELETE CONSUMER */
/* ========================= */

function deleteConsumer(id){

  if(
    !confirm(
      "Delete this consumer and all monthly records?"
    )
  ){

    return;

  }


  data.consumers =
    data.consumers.filter(
      c => c.id !== id
    );


  if(data.selected === id){

    data.selected =
      null;

    clearForm();

  }


  saveData();

  renderConsumers();

  renderHistory();


  document.getElementById("bill").innerHTML =
    '<div class="empty">Select a consumer and calculate a bill.</div>';

}


/* ========================= */
/* CLEAR FORM */
/* ========================= */

function clearForm(){

  document.getElementById("name").value =
    "";

  document.getElementById("consumerNo").value =
    "";

  document.getElementById("meterNo").value =
    "";

  document.getElementById("mobile").value =
    "";

  document.getElementById("address").value =
    "";

}


/* ========================= */
/* SAVE MONTHLY READING */
/* ========================= */

function saveReading(){

  const consumer =
    getSelectedConsumer();


  if(!consumer){

    alert(
      "First select or save a consumer."
    );

    return;

  }


  const month =
    document
      .getElementById("month")
      .value;


  const previous =
    Number(
      document
        .getElementById("previous")
        .value
    );


  const current =
    Number(
      document
        .getElementById("current")
        .value
    );


  const rate =
    Number(
      document
        .getElementById("rate")
        .value
    );


  if(!month){

    alert(
      "Please select month."
    );

    return;

  }


  if(current < previous){

    alert(
      "Current reading cannot be less than previous reading."
    );

    return;

  }


  const units =
    current - previous;


  const amount =
    units * rate;


  const existing =
    consumer.readings.find(
      r => r.month === month
    );


  /* UPDATE MONTH */

  if(existing){

    existing.previous =
      previous;

    existing.current =
      current;

    existing.units =
      units;

    existing.rate =
      rate;

    existing.amount =
      amount;

  }


  /* NEW MONTH */

  else{

    consumer.readings.push({

      month:
        month,

      previous:
        previous,

      current:
        current,

      units:
        units,

      rate:
        rate,

      amount:
        amount

    });

  }


  consumer.readings.sort(
    (a,b) =>
      a.month.localeCompare(b.month)
  );


  saveData();

  renderHistory();

  createBill(month);


  alert(
    "Monthly reading saved. ✅"
  );

}


/* ========================= */
/* CALCULATE BILL */
/* ========================= */

function calculateBill(){

  const consumer =
    getSelectedConsumer();


  if(!consumer){

    alert(
      "First select a consumer."
    );

    return;

  }


  const month =
    document
      .getElementById("month")
      .value;


  if(!month){

    alert(
      "Select a month."
    );

    return;

  }


  const previous =
    Number(
      document
        .getElementById("previous")
        .value
    );


  const current =
    Number(
      document
        .getElementById("current")
        .value
    );


  const rate =
    Number(
      document
        .getElementById("rate")
        .value
    );


  if(current < previous){

    alert(
      "Current reading cannot be less than previous reading."
    );

    return;

  }


  const units =
    current - previous;


  const amount =
    units * rate;


  showBill(
    consumer,
    month,
    previous,
    current,
    units,
    rate,
    amount
  );

}


/* ========================= */
/* CREATE BILL FROM HISTORY */
/* ========================= */

function createBill(month){

  const consumer =
    getSelectedConsumer();


  if(!consumer){
    return;
  }


  const r =
    consumer.readings.find(
      x => x.month === month
    );


  if(!r){
    return;
  }


  showBill(

    consumer,

    r.month,

    r.previous,

    r.current,

    r.units,

    r.rate,

    r.amount

  );

}


/* ========================= */
/* SHOW BILL */
/* ========================= */

function showBill(
  consumer,
  month,
  previous,
  current,
  units,
  rate,
  amount
){

  const formattedMonth =
    new Date(
      month + "-01"
    ).toLocaleDateString(
      "en-IN",
      {
        month:"long",
        year:"numeric"
      }
    );


  document.getElementById("bill").innerHTML = `

    <div class="bill-head">

      <div>

        <h2>
          ⚡ Electricity Bill
        </h2>

        <strong>
          Lavanya Singh Electricity Board
        </strong>

      </div>


      <div>

        <span class="badge">
          ${formattedMonth}
        </span>

      </div>

    </div>


    <p>
      <strong>Consumer:</strong>
      ${escapeHTML(consumer.name)}
    </p>


    <p>
      <strong>Consumer No:</strong>
      ${escapeHTML(consumer.consumerNo || "-")}
    </p>


    <p>
      <strong>Meter No:</strong>
      ${escapeHTML(consumer.meterNo)}
    </p>


    <p>
      <strong>Mobile:</strong>
      ${escapeHTML(consumer.mobile || "-")}
    </p>


    <p>
      <strong>Address:</strong>
      ${escapeHTML(consumer.address || "-")}
    </p>


    <hr>


    <p>
      Previous Reading:
      <strong>
        ${previous}
      </strong>
    </p>


    <p>
      Current Reading:
      <strong>
        ${current}
      </strong>
    </p>


    <p>
      Units Consumed:
      <strong>
        ${units}
      </strong>
    </p>


    <p>
      Rate:
      <strong>
        ₹${rate} / unit
      </strong>
    </p>


    <hr>


    <div class="amount">
      ₹${amount.toFixed(2)}
    </div>


    <p>
      Amount Payable
    </p>

  `;

}


/* ========================= */
/* RENDER CONSUMERS */
/* ========================= */

function renderConsumers(){

  const box =
    document.getElementById(
      "consumerList"
    );


  if(
    data.consumers.length === 0
  ){

    box.innerHTML =
      '<div class="empty">No consumers saved yet.</div>';

    return;

  }


  box.innerHTML =
    data.consumers.map(
      c => `

      <div class="consumer">

        <div class="consumer-info">

          <strong>
            ${escapeHTML(c.name)}
          </strong>

          <small>

            Meter:
            ${escapeHTML(c.meterNo)}

            ${
              data.selected === c.id
              ? " • Selected"
              : ""
            }

          </small>

        </div>


        <div
          class="btn-row"
          style="margin:0">

          <button
            onclick="selectConsumer('${c.id}')">

            Select

          </button>


          <button
            class="danger"
            onclick="deleteConsumer('${c.id}')">

            Delete

          </button>

        </div>

      </div>

    `
    ).join("");

}


/* ========================= */
/* RENDER HISTORY */
/* ========================= */

function renderHistory(){

  const box =
    document.getElementById(
      "history"
    );


  const consumer =
    getSelectedConsumer();


  if(!consumer){

    box.innerHTML =
      '<div class="empty">Select a consumer to see history.</div>';

    return;

  }


  if(
    consumer.readings.length === 0
  ){

    box.innerHTML =
      '<div class="empty">No monthly readings saved.</div>';

    return;

  }


  let html = `

    <p>

      <strong>
        ${escapeHTML(consumer.name)}
      </strong>

      —

      Meter
      ${escapeHTML(consumer.meterNo)}

    </p>


    <div style="overflow-x:auto">

      <table class="reading-table">

        <thead>

          <tr>

            <th>
              Month
            </th>

            <th>
              Previous
            </th>

            <th>
              Current
            </th>

            <th>
              Units
            </th>

            <th>
              Rate
            </th>

            <th>
              Bill
            </th>

          </tr>

        </thead>


        <tbody>

  `;


  consumer.readings.forEach(
    r => {

      const monthName =
        new Date(
          r.month + "-01"
        ).toLocaleDateString(
          "en-IN",
          {
            month:"short",
            year:"numeric"
          }
        );


      html += `

        <tr>

          <td>
            ${monthName}
          </td>

          <td>
            ${r.previous}
          </td>

          <td>
            ${r.current}
          </td>

          <td>
            ${r.units}
          </td>

          <td>
            ₹${r.rate}
          </td>

          <td>
            <strong>
              ₹${r.amount.toFixed(2)}
            </strong>
          </td>

        </tr>

      `;

    }
  );


  html += `

        </tbody>

      </table>

    </div>

  `;


  box.innerHTML =
    html;

}


/* ========================= */
/* SHARE BILL */
/* ========================= */

async function shareBill(){

  const consumer =
    getSelectedConsumer();


  if(!consumer){

    alert(
      "Select a consumer first."
    );

    return;

  }


  const text =
    document
      .getElementById("bill")
      .innerText;


  if(navigator.share){

    try{

      await navigator.share({

        title:
          "Electricity Bill",

        text:
          text

      });

    }

    catch(e){}

  }


  else{

    try{

      await navigator.clipboard.writeText(
        text
      );

      alert(
        "Bill copied. You can paste it anywhere.
